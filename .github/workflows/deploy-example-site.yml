name: Deploy exampleSite to GitHub Pages

# Deploy on every push to main — a merge landing there is a push, so this
# covers branch merges and direct pushes alike. workflow_dispatch stays for
# manual redeploys from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Hugo modules (the go.mod replace to ../) need the Go toolchain
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # replace-only module: nothing to fetch, and no go.sum to cache
          cache: false

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # package.json / packages/ are gitignored hugo mod npm pack output;
      # regenerate them from the theme's package.hugo.json before installing
      - name: Regenerate and install Node dependencies
        working-directory: exampleSite
        run: |
          hugo mod npm pack
          npm install

      # hugo_stats.json is gitignored by design; the first pass generates it
      # so the second pass can build the final CSS with the full class set
      - name: Build (generate hugo_stats.json)
        run: hugo --source exampleSite --baseURL https://dangpangch.github.io/ferro/

      - name: Build
        run: hugo --gc --minify --source exampleSite --baseURL https://dangpangch.github.io/ferro/

      # The demo runs ferro.search: pagefind — index the built HTML.
      - name: Pagefind index
        run: npx pagefind --site exampleSite/public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
