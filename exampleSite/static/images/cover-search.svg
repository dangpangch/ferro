    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/><circle cx="320" cy="80" r="3"/><circle cx="400" cy="80" r="3"/><circle cx="480" cy="80" r="3"/><circle cx="560" cy="80" r="3"/><circle cx="640" cy="80" r="3"/><circle cx="720" cy="80" r="3"/><circle cx="800" cy="80" r="3"/><circle cx="880" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="800" cy="160" r="3"/><circle cx="880" cy="160" r="3"/>
    <circle cx="80" cy="440" r="3"/><circle cx="160" cy="440" r="3"/><circle cx="800" cy="440" r="3"/><circle cx="880" cy="440" r="3"/>
    <circle cx="80" cy="520" r="3"/><circle cx="160" cy="520" r="3"/><circle cx="240" cy="520" r="3"/><circle cx="320" cy="520" r="3"/><circle cx="400" cy="520" r="3"/><circle cx="480" cy="520" r="3"/><circle cx="560" cy="520" r="3"/><circle cx="640" cy="520" r="3"/><circle cx="720" cy="520" r="3"/><circle cx="800" cy="520" r="3"/><circle cx="880" cy="520" r="3"/>
