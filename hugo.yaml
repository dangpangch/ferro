params:
  summaryLength: 70
  favicon: /favicon.svg
  # SEO / social-sharing defaults (see layouts/_partials/head/meta.html)
  meta:
    description: ""
    # ogImage: /images/og-default.png
    # twitter: "@yourhandle"
  # Theme-level defaults only — the complete option registry; docs mirror this
  # table (exampleSite/content/*/posts/configuration.md). Demo-tuned values
  # live in exampleSite/hugo.yaml. Code-level exceptions (reading_speed, tabs
  # fallback): see AGENTS.md "Theme Config Options — Registry Rule".
  ferro:
    enablei18n: true
    sidePane: true
    # Opt-in paper-grain background texture
    grain: false
    countPageItems: 7
    # Search engine: "flexsearch" (built-in, zero config) | "pagefind"
    # (requires `npx pagefind --site public` after the Hugo build) | "off".
    search: flexsearch
    home:
      # Without these the out-of-box home renders no bio and no tabs
      showBio: true
      showASCIIArt: true
      showFeatured: true
      showRecent: true
      showAuthorImg: false
      hideRecentWhenFeatured: false
      countPosts: 5
    page:
      showYearCount: false
    side:
      home:
        sidePaneSticky: false
        taxonomies: []
        countTaxonomy: 3
      term:
        sidePaneSticky: false
      single:
        sidePaneSticky: false
        showDetails: false
        showTableOfContents: false
        showAttachments: false
        showRelated: false
        countRelated: 5
  links:
    hugo: https://gohugo.io/
    theme: https://github.com/dangpangch/ferro

related:
  includeNewer: true
  indices:
    - name: tags
      weight: 100

taxonomies:
  tag: tags
  topic: topics
  series: series

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  mounts:
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
  hugoVersion:
    extended: false
    min: 0.158.0
security:
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
# Syntax highlighting: class-based tokens (noClasses: false), colored by
# assets/css/code/gruvbox-light.css (light) and gruvbox-dark.css (dark).
markup:
  highlight:
    codeFences: true
    noClasses: false
    style: gruvbox
  goldmark:
    extensions:
      # Passthrough hands TeX math to render-passthrough.html, which renders
      # it at build time via transform.ToMath; only the KaTeX stylesheet is
      # loaded at runtime (head.html, gated on the hasMath page-store flag).
      # Inline $..$ is deliberately not enabled (collides with dollar signs in
      # prose); sites can add it under passthrough.delimiters.inline.
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
    renderer:
      # Nested shortcodes (e.g. a note inside details) render through a second
      # Markdown pass that strips raw HTML unless unsafe is on. markup merges
      # shallowly, so sites defining their own markup block must repeat it.
      unsafe: true
    parser:
      # Standalone images stay block-level: lets the image hook emit <figure>
      # and apply {width=...} attributes to the image, not a wrapping <p>.
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true

# Search index output format. The CopyPage format is also defined here but
# intentionally NOT mounted in outputs: sites opt in via outputs.page, so no
# per-page index.md is generated until they do (the copy-page button renders
# only when the format is mounted).
outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: searchindex
    isPlainText: true
    notAlternative: true
  # Markdown source fetched by the "copy page" button on click, so the raw
  # content is not inlined as JSON into every page (see page.copypage.md).
  CopyPage:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    notAlternative: true

mediaTypes:
  application/json:
    suffixes:
      - json
  text/markdown:
    suffixes:
      - md

outputs:
  home:
    - HTML
    - RSS
    - SearchIndex
