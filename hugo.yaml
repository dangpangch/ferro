baseURL: https://example.org/
title: "ferro"
enableRobotsTXT: true
defaultContentLanguage: en

languages:
  en:
    weight: 1
    locale: en-US
    label: English
    contentDir: content/en
    menus:
      main:
        - name: Posts
          pageRef: /posts
          weight: 1
        - name: Features
          pageRef: /features
          weight: 2
        - name: About
          pageRef: /about
          weight: 3
  zh:
    weight: 2
    locale: zh-CN
    label: 中文
    contentDir: content/zh
    menus:
      main:
        - name: 文章
          pageRef: /posts
          weight: 1
        - name: 功能
          pageRef: /features
          weight: 2
        - name: 关于
          pageRef: /about
          weight: 3

params:
  summaryLength: 70
  favicon: /favicon.svg
  author:
    name: DangPang
  ferro:
    enablei18n: true
    sidePane: true
    countPageItems: 7
    home:
      showBio: true
      showAuthorImg: false
      showASCIIArt: true
      sidePaneTags: true
      showFeatured: true
      showRecent: true
      hideRecentWhenFeatured: true
      countRecent: 5
    side:
      home:
        sidePaneSticky: false
        taxonomies:
          - tags
          - series
        countTaxonomy: 3
      list:
        sidePaneSticky: false
      term:
        sidePaneSticky: false
      taxonomy:
        sidePaneSticky: false
      single:
        sidePaneSticky: true
        showDetails: true
        showTableOfContents: true
        showAttachments: true
        showRelated: true
        countRelated: 5
  links:
    hugo: https://gohugo.io/
    theme: https://github.com/dangpangch/ferro

related:
  includeNewer: true
  indices:
    - name: tags
      weight: 100

taxonomies:
  tag: tags
  topic: topics
  series: series

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
  hugoVersion:
    extended: false
    min: 0.158.0

# Syntax highlighting: class-based tokens (noClasses: false), colored by
# assets/css/code/gruvbox-light.css (light) and gruvbox-dark.css (dark).
markup:
  highlight:
    codeFences: true
    noClasses: false
    style: gruvbox

# Search index output format
outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: searchindex
    isPlainText: true
    notAlternative: true

mediaTypes:
  application/json:
    suffixes:
      - json

outputs:
  home:
    - HTML
    - RSS
    - SearchIndex
