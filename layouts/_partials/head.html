<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>
  {{ if .IsHome }}
    {{ site.Title }}
  {{ else }}
    {{ printf "%s | %s" .Title
      site.Title
    }}
  {{ end }}
</title>
{{ $faviconPath := default site.Params.favicon "/favicon.svg" }}
<link
  rel="icon"
  href="{{ $faviconPath | relURL }}"
  sizes="any"
  type="image/svg+xml"
/>

{{ with (templates.Defer (dict "key" "global")) }}
  {{ partial "head/css.html" . }}
{{ end }}
{{- partialCached "head/js.html" . -}}
