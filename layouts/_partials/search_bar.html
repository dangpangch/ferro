{{- /* Opens the global search panel (see search_panel.html) */ -}}
<button
  class="search-bar search-bar-button"
  type="button"
  aria-haspopup="dialog"
  aria-expanded="false"
  aria-controls="search-panel"
>
  {{- partial "icon.html" (dict "name" "search") -}}
  <span class="search-bar-placeholder">{{- i18n "search_placeholder" -}}</span>
</button>
