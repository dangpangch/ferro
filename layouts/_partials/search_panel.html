{{- /* Global search panel — command palette, mounted in baseof.html.
  Driven by assets/js/search/search.js against the /searchindex.json index. */
-}}
<div class="search-panel" id="search-panel" hidden>
  <div class="search-panel-backdrop" data-search-close></div>
  <div
    class="search-panel-dialog"
    role="dialog"
    aria-modal="true"
    aria-label="{{- i18n "search" -}}"
  >
    <div class="search-panel-input">
      {{- partial "icon.html" (dict "name" "search" "class" "m-0 opacity-50") -}}
      <input
        class="search-text text-fg placeholder:text-muted min-w-0 flex-1 border-none bg-transparent font-sans text-base outline-none [&::-webkit-search-cancel-button]:appearance-none [&::-webkit-search-decoration]:appearance-none"
        type="search"
        role="combobox"
        aria-expanded="true"
        aria-controls="search-results"
        aria-autocomplete="list"
        aria-activedescendant=""
        autocomplete="off"
        spellcheck="false"
        placeholder="{{- i18n "search_placeholder" -}}"
      />
      <button
        class="text-muted inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-md border-none bg-transparent"
        type="button"
        aria-label="{{- i18n "search_close" -}}"
        data-search-close
      >
        {{- partial "icon.html" (dict "name" "x" "class" "m-0") -}}
      </button>
    </div>

    <div class="overflow-y-auto px-4">
      <p class="search-loading text-muted my-4 font-sans text-sm">
        {{- i18n "search_loading" -}}
      </p>

      <div
        class="search-empty text-muted py-4 text-[0.9375rem]"
        id="search-empty"
        hidden
        role="status"
        data-empty="{{- i18n "search_empty" -}}"
        data-no-results="{{- i18n "search_no_results" -}}"
        data-hint="{{- i18n "search_no_results_hint" -}}"
      ></div>

      <ul
        class="search-results list-none"
        id="search-results"
        role="listbox"
        aria-label="{{- i18n "search" -}}"
      ></ul>
    </div>

    <footer
      class="border-border flex items-center justify-between gap-4 border-t px-4 py-2"
    >
      <p
        class="search-count text-muted font-mono text-xs"
        role="status"
        data-count-one="{{- i18n "search_count_one" -}}"
        data-count-many="{{- i18n "search_count_many" -}}"
      ></p>
      <p
        class="search-keys whitespace-nowrap max-[480px]:hidden"
        aria-hidden="true"
      >
        {{- i18n "search_keys" -}}
      </p>
    </footer>
  </div>
</div>
